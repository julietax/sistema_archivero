<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestion Digital de Archivos</title>
    <link rel="stylesheet" href="styles.css">
    <!-- FontAwesome para el ícono del ojo -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

    <div class="login-card">
        <!-- Encabezado con logo y títulos alineados -->
        <div class="login-header">
            <img src="logo.png" alt="Logo ITS" class="login-logo">
            <div class="login-titles">
                <h2>Sistema de Gestion Digital de Archivos</h2>
                <p>Instituto Tecnologico De Saltillo</p>
            </div>
        </div>

        <form id="loginForm">
            <!-- Campo Correo Institucional -->
            <div class="form-group">
                <label for="correo">Correo Institucional</label>
                <input type="email" id="correo" name="correo" required autocomplete="email">
                <span class="input-helper-text">ejemplo@its.edu.mx</span>
            </div>

            <!-- Campo Contraseña -->
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <div class="password-input-container">
                    <input type="password" id="contrasena" name="contrasena" required autocomplete="current-password">
                    <i class="fa-regular fa-eye" id="togglePassword" title="Mostrar/Ocultar contraseña"></i>
                </div>
            </div>

            <div id="loginAlert" class="login-alert" style="display: none;"></div>

            <!-- Botones -->
            <button type="submit" class="btn-iniciar-sesion">Iniciar Sesión</button>
            <button type="button" id="btnCancelarLogin" class="btn-cancelar-login">Cancelar</button>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
